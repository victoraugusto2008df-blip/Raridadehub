<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Página não encontrada — Raridade Hub</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet"/>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #08080f;
    color: #e2e8f0;
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 2rem;
  }
  .wrap { max-width: 420px; }
  .code {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 6rem;
    font-weight: 700;
    color: rgba(125,211,252,0.15);
    line-height: 1;
    margin-bottom: 1.5rem;
    letter-spacing: -0.04em;
  }
  h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 1.4rem;
    font-weight: 700;
    color: #fff;
    margin-bottom: 0.75rem;
  }
  p { font-size: 14px; color: #64748b; margin-bottom: 2rem; line-height: 1.7; }
  a {
    display: inline-block;
    background: #7dd3fc;
    color: #080810;
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 600;
    font-size: 0.875rem;
    padding: 0.7rem 1.75rem;
    border-radius: 8px;
    text-decoration: none;
    transition: box-shadow 0.2s;
  }
  a:hover { box-shadow: 0 0 20px rgba(125,211,252,0.4); }
  .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: #7dd3fc;
    box-shadow: 0 0 10px #7dd3fc;
    margin: 0 auto 2rem;
    animation: p 2s ease-in-out infinite;
  }
  @keyframes p { 0%,100%{opacity:1} 50%{opacity:0.4} }
</style>
</head>
<body>
  <div class="wrap">
    <div class="dot"></div>
    <div class="code">404</div>
    <h1>Página não encontrada</h1>
    <p>A página que você procura não existe ou foi movida.<br/>Volte para o início e encontre o que precisa.</p>
    <a href="/raridade-hub/">← Voltar ao site</a>
  </div>
</body>
</html>
